<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meh Songs + Live Likes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the Inter font and general body styling */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f4;
        }
        /* Hide scrollbar for a cleaner look */
        body::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none; /* IE and Edge */
            scrollbar-width: none; /* Firefox */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4 sm:px-6 lg:px-8">

    <h1 class="text-4xl font-extrabold text-gray-900 mb-8 rounded-lg p-4 bg-gradient-to-r from-purple-400 to-pink-500 text-white shadow-lg">
        🎵 Meh Songs Archived
    </h1>

    <!-- Audio + Like Buttons Section -->
    <div class="w-full max-w-2xl bg-white p-6 rounded-xl shadow-lg mb-10">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Songs</h2>

        <!-- Song 1: shouldn't be -->
        <div class="mb-8 p-4 bg-gray-50 rounded-lg shadow-inner">
            <h3 class="text-xl font-semibold text-gray-700 mb-3">shouldn't be</h3>
            <audio src="https://raw.githubusercontent.com/manlinh/shouldnt/main/shouldnt_be_cover.m4a" controls class="w-full mb-4 rounded-md"></audio>
            <button onclick="like('shouldnt_be')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105">
                👍 Like
            </button>
        </div>

        <!-- Song 2: simple things -->
        <div class="mb-8 p-4 bg-gray-50 rounded-lg shadow-inner">
            <h3 class="text-xl font-semibold text-gray-700 mb-3">simple things</h3>
            <audio src="https://raw.githubusercontent.com/manlinh/shouldnt/main/simple_things_cover.m4a" controls class="w-full mb-4 rounded-md"></audio>
            <button onclick="like('simple_things')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105">
                👍 Like
            </button>
        </div>

        <!-- Song 3: trust me -->
        <div class="p-4 bg-gray-50 rounded-lg shadow-inner">
            <h3 class="text-xl font-semibold text-gray-700 mb-3">trust me</h3>
            <audio src="https://raw.githubusercontent.com/manlinh/shouldnt/main/trust_me_cover.m4a" controls class="w-full mb-4 rounded-md"></audio>
            <button onclick="like('trust_me')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105">
                👍 Like
            </button>
        </div>
    </div>

    <!-- JSON Viewer Section -->
    <div class="w-full max-w-2xl bg-white p-6 rounded-xl shadow-lg">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">📦 Current Likes (JSON)</h2>
        <div id="loadingIndicator" class="text-center text-gray-500 mb-4 hidden">Loading likes...</div>
        <pre id="jsonOutput" class="bg-gray-100 p-6 rounded-lg text-left overflow-auto text-sm sm:text-base font-mono border border-gray-200 shadow-inner max-h-96">
            Loading...
        </pre>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase modules - using version 11.10.0 as per your config
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
        import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
        // Removed: import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-analytics.js";

        // Global variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        let firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        // Use the provided Firebase config, with a robust fallback
        if (Object.keys(firebaseConfig).length === 0 || !firebaseConfig.projectId) {
            console.warn("Using user-provided fallback Firebase config as __firebase_config is incomplete or missing.");
            firebaseConfig = {
                apiKey: "AIzaSyCoqH0uBmolDOfNStTFOpEgYl89ZbTZsv8",
                authDomain: "meh-likes.firebaseapp.com",
                projectId: "meh-likes",
                storageBucket: "meh-likes.firebasestorage.app",
                messagingSenderId: "234059621506",
                appId: "1:234059621506:web:51eb832bbdff9b9c04c09b",
                measurementId: "G-CBE1P2HWXE" // Kept in config, but not used for initialization
            };
        }

        // Ensure databaseURL is explicitly set for Realtime Database
        if (!firebaseConfig.databaseURL && firebaseConfig.projectId) {
            firebaseConfig.databaseURL = `https://${firebaseConfig.projectId}-default-rtdb.firebaseio.com`;
            console.log("Constructed databaseURL:", firebaseConfig.databaseURL);
        } else if (!firebaseConfig.databaseURL && !firebaseConfig.projectId) {
            console.error("Critical Error: Firebase Project ID is missing. Cannot determine Database URL.");
            document.getElementById("jsonOutput").textContent = "Error: Firebase Project ID is missing. Cannot connect to database.";
            throw new Error("Firebase Project ID is missing."); // Halt execution if critical config is missing
        }

        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app;
        let db;
        let auth;
        // Removed: let analytics;
        let userId = null; // To store the authenticated user ID

        // Initialize Firebase and authenticate
        async function initializeFirebase() {
            console.log("Attempting to initialize Firebase...");
            try {
                app = initializeApp(firebaseConfig);
                db = getDatabase(app);
                auth = getAuth(app);

                // Removed: Conditional analytics initialization
                console.log("Firebase app initialized successfully.");

                // Authenticate user
                if (initialAuthToken) {
                    console.log("Signing in with custom token...");
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    console.log("Signing in anonymously...");
                    await signInAnonymously(auth);
                }
                console.log("Authentication initiated.");

                // Listen for authentication state changes
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        console.log("User authenticated:", userId);
                        setupRealtimeLikesListener(); // Start listening to database changes only after authentication
                    } else {
                        console.log("No user is signed in. Attempting anonymous sign-in if not already.");
                        // If onAuthStateChanged fires with no user, and we haven't tried anonymous, try it.
                        // This handles cases where initialAuthToken might be null and anonymous sign-in failed.
                        if (!initialAuthToken && !auth.currentUser) {
                             signInAnonymously(auth).catch(err => console.error("Anonymous sign-in failed:", err));
                        }
                        userId = null;
                        document.getElementById("jsonOutput").textContent = "Please sign in to view and like songs.";
                    }
                });

            } catch (error) {
                console.error("Error during Firebase initialization or authentication:", error);
                document.getElementById("jsonOutput").textContent = `Error: ${error.message}. Check console for details.`;
            }
        }

        // Function to set up the real-time listener for likes
        function setupRealtimeLikesListener() {
            if (!db || !userId) {
                console.warn("Database or user not ready for listener setup.");
                return;
            }
            const likesRef = ref(db, `artifacts/${appId}/public/data/likes`); // Use public data path
            console.log("Setting up real-time listener for path:", `artifacts/${appId}/public/data/likes`);

            const jsonOutputElement = document.getElementById("jsonOutput");
            const loadingIndicator = document.getElementById("loadingIndicator");

            loadingIndicator.classList.remove('hidden'); // Show loading indicator
            jsonOutputElement.textContent = ''; // Clear previous content

            // Listen for real-time updates
            onValue(likesRef, (snapshot) => {
                loadingIndicator.classList.add('hidden'); // Hide loading indicator once data is received
                const data = snapshot.val();
                console.log("Real-time data received:", data);
                if (data) {
                    jsonOutputElement.textContent = JSON.stringify(data, null, 2);
                } else {
                    jsonOutputElement.textContent = "No likes recorded yet.";
                }
            }, (error) => {
                loadingIndicator.classList.add('hidden');
                console.error("Error fetching real-time data from Firebase:", error);
                document.getElementById("jsonOutput").textContent = "Failed to load real-time data: " + error.message;
            });
        }

        // Global like function
        window.like = (songKey) => {
            if (!db || !userId) {
                console.error("Attempted to like song, but Firebase is not initialized or user is not authenticated.");
                const jsonOutputElement = document.getElementById("jsonOutput");
                jsonOutputElement.textContent = "Please wait for authentication to complete before liking songs.";
                return;
            }

            const songRef = ref(db, `artifacts/${appId}/public/data/likes/${songKey}`);
            console.log(`Attempting to increment like for ${songKey} at path: artifacts/${appId}/public/data/likes/${songKey}`);

            runTransaction(songRef, (current) => {
                const newValue = (current || 0) + 1;
                console.log(`Transaction: current value for ${songKey} is ${current}, new value will be ${newValue}`);
                return newValue; // Increment like count, initializing to 0 if null
            })
            .then((result) => {
                if (result.committed) {
                    console.log(`Successfully liked ${songKey}. New value: ${result.snapshot.val()}`);
                } else {
                    console.log(`Transaction for ${songKey} was aborted (not committed).`);
                }
            })
            .catch((error) => {
                console.error(`Transaction failed for ${songKey}:`, error);
                const jsonOutputElement = document.getElementById("jsonOutput");
                jsonOutputElement.textContent = `Error liking song: ${error.message}`;
            });
        };

        // Initialize Firebase when the window loads
        window.onload = initializeFirebase;
    </script>

</body>
</html>
