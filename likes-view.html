<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Likes JSON</title>
  <style>
    body { font-family: monospace; background: #f4f4f4; padding: 20px; }
    h1 { font-size: 1.5em; }
    pre {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

<h1>📦 Live Firebase Likes (JSON)</h1>
<pre id="jsonOutput">Loading...</pre>

<script>
  async function loadLikesJSON() {
    try {
      const response = await fetch("https://meh-likes-default-rtdb.firebaseio.com/likes.json");
      const data = await response.json();
      document.getElementById("jsonOutput").textContent = JSON.stringify(data, null, 2);
    } catch (error) {
      document.getElementById("jsonOutput").textContent = "Failed to load data: " + error;
    }
  }

  // Load once on page load
  loadLikesJSON();

  // Optional: Refresh every 10 seconds (live update)
  setInterval(loadLikesJSON, 10000);
</script>

</body>
</html>
